[project]
name = "marionette"
version = "0.1.0"
description = "A polygraph for LLMs: linear deception probes, a sparse-autoencoder thought stream and a truth-serum steering vector for Qwen3, live in the browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aamod Bhatt" }]
requires-python = ">=3.12,<3.13"
keywords = [
  "interpretability",
  "deception-detection",
  "linear-probes",
  "sparse-autoencoder",
  "steering",
  "honesty",
  "llm",
  "qwen3",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "torch==2.14.1",
  "transformers>=5.0",
  "accelerate>=1.2",
  "tokenizers>=0.22",
  "huggingface-hub>=1.0",
  "safetensors>=0.5",
  "pyarrow>=18",
  "numpy>=2.1",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "typer>=0.15",
]

[project.scripts]
marionette = "marionette.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.120",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]
docs = ["matplotlib>=3.9", "playwright>=1.49", "pillow>=11"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marionette"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PIE", "RET", "TID", "PL", "NPY", "PERF",
]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "N812", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["marionette"]
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "transformers", "transformers.*", "matplotlib", "matplotlib.*", "accelerate", "accelerate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not gpu and not network\""
markers = [
  "gpu: needs a CUDA GPU and downloaded weights (excluded by default)",
  "network: needs network access (excluded by default)",
]
